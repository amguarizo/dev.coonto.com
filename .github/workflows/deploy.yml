name: Deploy Coonto Production to Ubuntu

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to coonto.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        if: env.SSH_PRIVATE_KEY != ''
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Package and Deploy
        if: env.SSH_PRIVATE_KEY != ''
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/coonto/prod' }}
        run: |
          mkdir -p /tmp/coonto-deployment-kit
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/coonto-deployment-kit/
          cd /tmp && tar -czf Coonto_Deployment_Kit_v1.1.0_Caddy.tar.gz coonto-deployment-kit
          scp -o StrictHostKeyChecking=no /tmp/Coonto_Deployment_Kit_v1.1.0_Caddy.tar.gz ${SERVER_USER}@${SERVER_HOST}:/tmp/Coonto_Deployment_Kit_v1.1.0_Caddy.tar.gz
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "sudo mkdir -p ${DEPLOY_PATH} && sudo tar -xzf /tmp/Coonto_Deployment_Kit_v1.1.0_Caddy.tar.gz -C ${DEPLOY_PATH} --strip-components=1 && rm /tmp/Coonto_Deployment_Kit_v1.1.0_Caddy.tar.gz && cd ${DEPLOY_PATH} && sudo ./coonto.sh install"

      - name: Notify configuration needed
        if: env.SSH_PRIVATE_KEY == ''
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "::warning ::SSH_PRIVATE_KEY secret não configurado no GitHub. O deploy automático será habilitado assim que os Secrets do repositório forem preenchidos."
